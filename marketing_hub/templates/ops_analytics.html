{% extends "redesign_base.html" %}
{% set active = 'ops' %}
{% block title %}Analytics Ops · Sintech Hub{% endblock %}
{% block page_title %}<span style="font-weight:600">🛠️ Analytics Ops</span>{% endblock %}
{% block page_actions %}
<button class="btn btn-primary" id="ops-run" type="button">▶️ Chạy pipeline</button>
{% endblock %}
{% block content %}
<div id="ops-app"><div class="ops-skel"></div></div>
<style>
  .ops-skel{height:80px;border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:opssh 1.2s infinite}
  @keyframes opssh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .ops-card{background:var(--surface,#1a1a1a);border:1px solid var(--border,rgba(255,255,255,.1));border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .ops-pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
  .b-ok{background:rgba(34,197,94,.15);color:#4ade80}.b-warn{background:rgba(245,158,11,.15);color:#fbbf24}
  .b-err{background:rgba(239,68,68,.15);color:#f87171}.b-gray{background:rgba(148,163,184,.15);color:#94a3b8}.b-info{background:rgba(59,130,246,.15);color:#60a5fa}
  .ops-step{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border,rgba(255,255,255,.08));border-radius:9px;margin-bottom:7px;background:rgba(255,255,255,.02);font-size:13px}
  .ops-step .nm{flex:1}.ops-step .dur{font-size:11px;color:var(--text-muted,#94a3b8)}
</style>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='ops_analytics.js') }}?v={{ now.timestamp()|int }}"></script>
{% endblock %}
