<!DOCTYPE html>
<html lang="vi" data-chrome="gradient" data-density="comfy"
  style="--accent-from:#cf8b74;--accent-to:#bd6a5d;--accent-ink:#9e4f47;--header-grad-from:#c98a7e;--header-grad-to:#b87a84;--header-ink:#ffffff;--sb-ink:#2a2230;--r:18px;--r-sm:12px">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog SEO Command Center — Sintech Hub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='blog_cc/fonts.css') }}" />
<link rel="stylesheet" href="{{ url_for('static', filename='blog_cc/sintech-hub.css') }}" />
<style>
  /* nút gạt Sáng/Tối nổi góc dưới-trái (cạnh sidebar) */
  #theme-toggle{position:fixed;left:14px;bottom:14px;z-index:70;display:inline-flex;align-items:center;gap:7px;
    padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;box-shadow:var(--card-shadow)}
  #theme-toggle:hover{color:var(--accent-ink);border-color:var(--accent-from)}
</style>
</head>
<body>
<div id="root"></div>
<button id="theme-toggle" title="Đổi sáng/tối">🌙 Tối</button>

<script>
  /* data thật từ Flask (thay cho data/*.js demo) */
  window.SH = {{ sh|tojson }};
  window.SHB = {{ shb|tojson }};
</script>
<script src="{{ url_for('static', filename='blog_cc/lib/sintech-icons.js') }}"></script>
<script src="{{ url_for('static', filename='blog_cc/lib/sintech-icons-2.js') }}"></script>
<script src="{{ url_for('static', filename='blog_cc/lib/sintech-icons-3.js') }}"></script>
<script src="{{ url_for('static', filename='blog_cc/lib/sintech-icons-4.js') }}"></script>
<script src="{{ url_for('static', filename='blog_cc/blog-content.js') }}"></script>
<script>
  (function () {
    var html = document.documentElement, btn = document.getElementById("theme-toggle");
    function apply(mode) {
      if (mode === "dark") { html.setAttribute("data-theme", "dark"); btn.innerHTML = "☀️ Sáng"; }
      else { html.removeAttribute("data-theme"); btn.innerHTML = "🌙 Tối"; }
    }
    apply(localStorage.getItem("bcc_theme") || "light");
    btn.addEventListener("click", function () {
      var dark = html.getAttribute("data-theme") === "dark";
      localStorage.setItem("bcc_theme", dark ? "light" : "dark");
      apply(dark ? "light" : "dark");
    });
  })();
</script>
</body>
</html>
